<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda des concours Troupeau - Société Canine Midi Côte d'Azur</title>
<meta name="description" content="Calendrier commun des concours de chiens de troupeau de la Société Canine Midi Côte d'Azur.">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
  :root {
    --vert: #2f3a35; --vert-clair: #eceae4; --sable: #f8f7f4; --texte: #1f2421;
    --gris: #6a6f6b; --bord: #e2ded5; --rouge: #9e3b2c; --orange: #a8651a; --bleu: #3d5a73;
    --bronze: #9c6f35; --bronze-clair: #f4ebdd;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--sable); color: var(--texte); line-height: 1.5; }
  header { background: #fff; border-bottom: 1px solid var(--bord); padding: 8px 16px;
           position: sticky; top: 0; z-index: 5; }
  header .ligne { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap;
                  align-items: center; gap: 8px 16px; justify-content: space-between; }
  .marque { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .marque img { width: 48px; height: 48px; }
  .marque .t1 { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
  .marque .t2 { font-size: .72rem; color: var(--bronze); letter-spacing: .08em; text-transform: uppercase; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; }
  nav a, nav button { color: var(--texte); text-decoration: none; padding: 7px 11px; border-radius: 6px;
                      background: transparent; border: 0; font: inherit; font-size: .95rem; cursor: pointer; }
  nav a:hover, nav button:hover { background: var(--vert-clair); }
  nav a.actif { background: var(--vert); color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { margin: 8px 0 12px; font-size: 1.45rem; font-family: var(--serif); }
  /* accueil */
  .hero { position: relative; color: #fff; background: #2f3a35 url(img/accueil-grand.jpg) center 60% / cover; }
  .hero::before { content: ""; position: absolute; inset: 0;
                  background: linear-gradient(90deg, rgba(18,22,20,.78) 0%, rgba(18,22,20,.45) 55%, rgba(18,22,20,.1) 100%); }
  .hero .dedans { position: relative; max-width: 1100px; margin: 0 auto; padding: 64px 16px;
                  display: flex; align-items: center; gap: 28px; min-height: 420px; }
  .hero img { width: 150px; height: 150px; flex-shrink: 0; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  .hero .surtitre { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: #e9d3b0; }
  .hero h2 { font-size: 2.4rem; line-height: 1.15; margin: 6px 0 12px; color: #fff; }
  .hero p { max-width: 560px; font-size: 1.05rem; margin: 0 0 20px; color: #f1efe9; }
  .hero .actions button { padding: 10px 18px; }
  .hero button.clair { background: #fff; color: var(--vert); border-color: #fff; }
  .hero button.contour { background: transparent; color: #fff; border-color: rgba(255,255,255,.8); }
  .a-venir { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .a-venir .carte { cursor: pointer; border-top: 3px solid var(--bronze); margin: 0; transition: box-shadow .15s; }
  .a-venir .carte:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .a-venir .quand { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--bronze); font-weight: 600; }
  .a-venir .titre { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; margin: 4px 0; }
  .section-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 26px; }
  .section-titre h2 { margin-bottom: 10px; }
  .section-titre::after { content: none; }
  h3 { margin: 18px 0 8px; font-size: 1.05rem; }
  .carte { background: #fff; border: 1px solid var(--bord); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .filtres { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .filtres label { font-size: .85rem; color: var(--gris); display: flex; flex-direction: column; gap: 2px; }
  label { font-size: .9rem; }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--bord);
                            border-radius: 6px; background: #fff; width: 100%; }
  textarea { min-height: 70px; }
  .filtres input, .filtres select { width: auto; min-width: 140px; }
  .filtres input[type=checkbox] { min-width: 0; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 14px; }
  .champ { display: flex; flex-direction: column; gap: 3px; }
  .champ.large { grid-column: 1 / -1; }
  button, .bouton { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--vert);
                    background: var(--vert); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondaire { background: #fff; color: var(--vert); }
  button.danger { background: #fff; color: var(--rouge); border-color: var(--rouge); }
  button.petit { padding: 4px 9px; font-size: .85rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .mois-titre { margin: 18px 0 8px; font-weight: 700; color: var(--vert); text-transform: capitalize; }
  .concours { display: flex; gap: 12px; cursor: pointer; }
  .concours:hover { border-color: var(--vert); }
  .date-bloc { min-width: 62px; text-align: center; background: var(--vert-clair); border-radius: 8px; padding: 6px; }
  .date-bloc .j { font-size: 1.4rem; font-weight: 700; color: var(--vert); line-height: 1.1; }
  .date-bloc .m { font-size: .8rem; text-transform: uppercase; color: var(--gris); }
  .concours .info { flex: 1; min-width: 0; }
  .concours .titre { font-weight: 700; }
  .sous { color: var(--gris); font-size: .9rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--vert-clair); color: var(--vert); }
  .badge { font-size: .78rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .b-ouvert { background: #dff1e1; color: #1f6b2c; }
  .b-bientot { background: #fdf0dc; color: var(--orange); }
  .b-clos { background: #eee; color: var(--gris); }
  .b-annule { background: #f6dedb; color: var(--rouge); }
  .b-provisoire { background: #e3ecf5; color: var(--bleu); }
  .b-champ { background: #f3e6f7; color: #6b2c84; }
  .vide { color: var(--gris); font-style: italic; padding: 20px 0; }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
  .msg.ok { background: #dff1e1; color: #1f6b2c; }
  .msg.err { background: #f6dedb; color: var(--rouge); }
  .msg.info { background: #e3ecf5; color: var(--bleu); }
  .cases { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .cases label { display: flex; gap: 5px; align-items: center; font-size: .9rem; }
  .cases input { width: auto; }
  fieldset { border: 1px solid var(--bord); border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; }
  legend { font-weight: 600; font-size: .9rem; color: var(--vert); padding: 0 4px; }
  .onglets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .onglets button { background: #fff; color: var(--vert); }
  .onglets button.actif { background: var(--vert); color: #fff; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--bord); font-size: .9rem; vertical-align: middle; }
  th { background: var(--vert-clair); }
  td input, td select { padding: 4px 6px; }
  .tableau { overflow-x: auto; }
  /* calendrier mensuel */
  .cal-nav { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .cal-nav .t { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; text-transform: capitalize; min-width: 190px; text-align: center; }
  main.large { max-width: 1400px; }
  .mg { border: 1px solid var(--bord); border-radius: 10px; overflow: hidden; background: #fff; }
  .mg-entete { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--vert); color: #fff; }
  .mg-entete div { padding: 8px; font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; text-align: center; }
  .mg-semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 26px repeat(var(--n), 24px) 1fr;
                min-height: 130px; border-top: 1px solid var(--bord); position: relative; row-gap: 3px; padding-bottom: 6px; }
  .mg-jour { grid-row: 1 / -1; border-left: 1px solid var(--bord); padding: 4px 6px; background: #fff; }
  .mg-jour:first-child { border-left: 0; }
  .mg-jour.hors { background: #f6f4ef; }
  .mg-jour.hors .n { color: #b3afa6; }
  .mg-jour.we { background: #fbfaf7; }
  .mg-jour.auj { box-shadow: inset 0 0 0 2px var(--bronze); }
  .mg-jour .n { font-size: .85rem; font-weight: 600; color: var(--gris); }
  .mg-jour.auj .n { color: var(--bronze); }
  .barre { z-index: 1; margin: 0 4px; border-radius: 5px; color: #fff; font-size: .78rem; line-height: 24px; height: 24px;
           padding: 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
           box-shadow: 0 1px 2px rgba(0,0,0,.15); align-self: start; }
  .barre:hover { filter: brightness(1.1); }
  .barre.suite-g { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
  .barre.suite-d { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
  .barre.provisoire, .leg-ech.provisoire { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.38) 0 5px, transparent 5px 10px); }
  .barre.annule, .leg-ech.annule { opacity: .5; text-decoration: line-through; }
  .barre .q { display: inline-block; background: #fff; color: #6b2c84; border-radius: 3px; font-size: .68rem; font-weight: 700;
              line-height: 15px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }
  .barre .autres { display: inline-flex; gap: 2px; margin-left: 5px; vertical-align: 0; }
  .barre .autres i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; display: inline-block; }
  .mg-entete .court { display: none; }
  .legende { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0 4px; font-size: .85rem; align-items: center; }
  .legende .groupe { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .legende .titre-leg { font-weight: 600; color: var(--gris); margin-right: 2px; }
  .leg-ech { display: inline-block; width: 26px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; background-color: #7b827d; }
  /* fenetre detail */
  #fenetre { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start;
             justify-content: center; padding: 30px 12px; overflow-y: auto; z-index: 10; }
  #fenetre.visible { display: flex; }
  #fenetre .contenu { background: #fff; border-radius: 12px; max-width: 640px; width: 100%; padding: 18px; position: relative; }
  #fenetre .fermer { position: absolute; top: 10px; right: 10px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0; }
  dt { color: var(--gris); font-size: .9rem; }
  dd { margin: 0; }
  footer { display: flex; align-items: center; justify-content: center; gap: 12px; text-align: left;
           color: var(--gris); font-size: .82rem; padding: 26px 16px; margin-top: 30px;
           border-top: 1px solid var(--bord); background: #fff; }
  footer strong { color: var(--texte); font-family: var(--serif); }
  @media (max-width: 640px) {
    .filtres label { flex: 1 1 100%; }
    .filtres input, .filtres select { width: 100%; }
    .mg-entete div { padding: 6px 2px; font-size: .68rem; letter-spacing: 0; }
    .mg-entete .long { display: none; }
    .mg-entete .court { display: inline; }
    .mg-semaine { grid-template-rows: 22px repeat(var(--n), 20px) 1fr; min-height: 90px; }
    .mg-jour { padding: 2px 3px; }
    .barre { font-size: .62rem; line-height: 20px; height: 20px; padding: 0 3px; margin: 0 1px; }
    .barre .q, .barre .autres { display: none; }
    dl { grid-template-columns: 1fr; }
    .marque img { width: 38px; height: 38px; }
    .marque .t1 { font-size: 1rem; }
    header { position: static; }
    .hero { background-image: url(img/accueil-petit.jpg); }
    .hero .dedans { flex-direction: column; align-items: flex-start; gap: 14px; padding: 36px 16px; min-height: 0; }
    .hero img { width: 84px; height: 84px; }
    .hero h2 { font-size: 1.7rem; }
    .hero p { font-size: .98rem; }
  }
</style>
</head>
<body>
<header>
  <div class="ligne">
    <a class="marque" href="#calendrier">
      <img src="img/logo-96.png" alt="Logo de la Société Canine Midi Côte d'Azur">
      <div><div class="t1">Agenda des concours Troupeau</div><div class="t2">Société Canine Midi Côte d'Azur</div></div>
    </a>
    <nav id="menu"></nav>
  </div>
</header>
<div id="bandeau"></div>
<main id="vue"><p class="vide">Chargement...</p></main>
<div id="fenetre" onclick="if (event.target === this) app.fermer()"><div class="contenu" id="fenetre-contenu"></div></div>
<footer>
  <img src="img/logo-96.png" alt="" width="44" height="44">
  <div><strong>Société Canine Midi Côte d'Azur</strong><br>
  Agenda commun des concours de chiens de troupeau. Les informations sont saisies par les organisateurs.<br>
  <a href="#mentions" style="color:inherit">Mentions légales et données personnelles</a></div>
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ===================== A REMPLACER =====================
const SUPABASE_URL = 'https://ctqhkmuaezkgtdmqdfyf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PgeQtylbGdtv5jJRtoelrA_Du3sTF3d';
// =======================================================

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const REGIONS = ['Auvergne-Rhône-Alpes', 'Bourgogne-Franche-Comté', 'Bretagne', 'Centre-Val de Loire',
  'Corse', 'Grand Est', 'Hauts-de-France', 'Île-de-France', 'Normandie', 'Nouvelle-Aquitaine',
  'Occitanie', 'Pays de la Loire', "Provence-Alpes-Côte d'Azur", 'Hors France'];
const STATUTS = { provisoire: 'Provisoire', confirme: 'Confirmé', annule: 'Annulé' };

const etat = {
  session: null, profil: null,
  familles: [], niveaux: [], championnats: [], juges: [], concours: [],
  filtres: { famille: '', niveau: '', region: '', texte: '', passes: false },
  moisAffiche: debutMois(new Date()),
  ongletAdmin: 'comptes', tousConcours: false, message: null,
};

// ---------- utilitaires ----------
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function aujourdhui() { return new Date().toLocaleDateString('sv-SE'); }
function debutMois(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function versDate(s) { return new Date(s + 'T00:00:00'); }
function isoLocal(d) { return d.toLocaleDateString('sv-SE'); }
function fmt(s, opts = { day: 'numeric', month: 'long', year: 'numeric' }) {
  return s ? versDate(s).toLocaleDateString('fr-FR', opts) : '';
}
function fmtPeriode(c) {
  if (!c.date_fin || c.date_fin === c.date_debut) return fmt(c.date_debut, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return 'du ' + fmt(c.date_debut, { day: 'numeric', month: 'long' }) + ' au ' + fmt(c.date_fin);
}
const COULEURS_DEFAUT = ['#3f7d4e', '#b5473a', '#2f6690', '#7a4d9c', '#a8732f', '#6b7280', '#2a8a8a', '#8a5a44'];
function couleurFamille(f) {
  if (!f) return '#7b827d';
  if (f.couleur) return f.couleur;
  const i = etat.familles.findIndex(x => x.id === f.id);
  return COULEURS_DEFAUT[(i < 0 ? 0 : i) % COULEURS_DEFAUT.length];
}
function famillesConcours(c) {
  const ids = [...new Set((c.niveaux || []).map(id => niveau(id)?.famille_id).filter(Boolean))];
  return ids.map(famille).filter(Boolean).sort((a, b) => a.ordre - b.ordre);
}
function niveau(id) { return etat.niveaux.find(n => n.id === id); }
function famille(id) { return etat.familles.find(f => f.id === id); }
function nomNiveau(id) {
  const n = niveau(id); if (!n) return null;
  const f = famille(n.famille_id);
  return (f ? f.nom + ' - ' : '') + n.nom;
}
function nomsJuges(c) {
  const l = (c.juges || []).map(id => etat.juges.find(j => j.id === id)?.nom).filter(Boolean);
  if (c.juge_autre) l.push(c.juge_autre);
  return l.join(', ');
}
function nomsChamp(c) {
  return (c.championnats || []).map(id => etat.championnats.find(x => x.id === id)?.nom).filter(Boolean);
}
function titreConcours(c) {
  if (c.titre) return c.titre;
  const fams = [...new Set((c.niveaux || []).map(id => famille(niveau(id)?.famille_id)?.nom).filter(Boolean))];
  return (fams.length ? 'Concours ' + fams.join(' / ') : 'Concours') + ' - ' + c.commune;
}
function badgeInscription(c) {
  if (c.statut === 'annule') return '<span class="badge b-annule">Annulé</span>';
  const t = aujourdhui();
  if (c.date_debut < t) return '';
  if (c.inscription_ouverture && t < c.inscription_ouverture)
    return `<span class="badge b-bientot">Inscriptions le ${fmt(c.inscription_ouverture, { day: 'numeric', month: 'short' })}</span>`;
  if (c.inscription_cloture && t > c.inscription_cloture) return '<span class="badge b-clos">Inscriptions closes</span>';
  if (c.inscription_ouverture || c.inscription_cloture) return '<span class="badge b-ouvert">Inscriptions ouvertes</span>';
  return '';
}
function badgesConcours(c) {
  let h = badgeInscription(c);
  if (c.statut === 'provisoire') h += '<span class="badge b-provisoire">Date provisoire</span>';
  if ((c.championnats || []).length) h += '<span class="badge b-champ">Qualificatif</span>';
  return h;
}
function valeur(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function ouNull(v) { return v === '' ? null : v; }
function cochees(nom) { return [...document.querySelectorAll(`input[name="${nom}"]:checked`)].map(i => Number(i.value)); }
function message(type, texte) { etat.message = { type, texte }; }
function blocMessage() {
  const m = etat.message;
  if (!m) return '';
  const h = location.hash || '#calendrier';
  if (!m.page) m.page = h;            // le message reste sur la page ou il s'affiche
  if (m.page !== h) return '';
  return `<div class="msg ${m.type}">${esc(m.texte)}</div>`;
}
function traduireErreur(e) {
  const t = e?.message || String(e);
  if (/Invalid login credentials/i.test(t)) return 'Email ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(t)) return "Ton email n'est pas encore confirmé : clique sur le lien recu par mail.";
  if (/already registered/i.test(t)) return 'Un compte existe déjà avec cet email.';
  if (/Password should be/i.test(t)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if (/row-level security/i.test(t)) return "Action refusée : ton compte n'a pas les droits (compte pas encore validé ?).";
  if (/rate limit/i.test(t)) return 'Trop de demandes, réessaie dans quelques minutes.';
  return t;
}
const estConnecte = () => !!etat.session;
const estValide = () => etat.profil?.statut === 'valide';
const estAdmin = () => estValide() && etat.profil?.role === 'admin';

// ---------- donnees ----------
async function chargerReferences() {
  const [f, n, c, j] = await Promise.all([
    sb.from('familles').select('*').order('ordre'),
    sb.from('niveaux').select('*').order('ordre'),
    sb.from('championnats').select('*').order('ordre'),
    sb.from('juges').select('*').order('nom'),
  ]);
  for (const r of [f, n, c, j]) if (r.error) throw r.error;
  etat.familles = f.data; etat.niveaux = n.data; etat.championnats = c.data; etat.juges = j.data;
}
async function chargerConcours() {
  const { data, error } = await sb.from('concours')
    .select('*, organisateur:organisateurs(nom_club, responsable, email, telephone, site_web)')
    .order('date_debut');
  if (error) throw error;
  etat.concours = data;
}
async function chargerProfil() {
  if (!etat.session) { etat.profil = null; return; }
  const { data, error } = await sb.from('organisateurs').select('*').eq('id', etat.session.user.id).maybeSingle();
  if (error) throw error;
  etat.profil = data;
}

// ---------- menu ----------
function menu() {
  const h = location.hash || '#calendrier';
  const lien = (href, txt) => `<a href="${href}" class="${h.startsWith(href) ? 'actif' : ''}">${txt}</a>`;
  let html = lien('#calendrier', 'Calendrier') + lien('#mois', 'Vue mensuelle');
  if (estConnecte()) {
    html += lien('#fiche', 'Ma fiche');
    if (estValide()) html += lien('#mes-concours', 'Mes concours');
    if (estAdmin()) html += lien('#admin', 'Administration');
    html += '<button onclick="app.deconnexion()">Déconnexion</button>';
  } else {

  }

}

// ---------- vue : calendrier public ----------
function concoursFiltres() {
  const f = etat.filtres, t = aujourdhui();
  return etat.concours.filter(c => {
    if (!f.passes && (c.date_fin || c.date_debut) < t) return false;
    if (f.niveau && !(c.niveaux || []).includes(Number(f.niveau))) return false;
    if (f.famille && !(c.niveaux || []).some(id => niveau(id)?.famille_id === Number(f.famille))) return false;
    if (f.region && c.region !== f.region) return false;
    if (f.texte) {
      const s = (titreConcours(c) + ' ' + c.commune + ' ' + (c.departement || '') + ' ' + (c.organisateur?.nom_club || '')).toLowerCase();
      if (!s.includes(f.texte.toLowerCase())) return false;
    }
    return true;
  });
}

}
function blocAVenir() {

      <div class="tags">${badgesConcours(c)}</div>
    </div>`).join('')}</div>`;
}

function carteConcours(c, avecActions = false) {

function vueListe() {
  const liste = concoursFiltres();
  if (!liste.length) return '<p class="vide">Aucun concours ne correspond à ces critères.</p>';
  let html = '', moisCourant = '';
  for (const c of liste) {
    const m = versDate(c.date_debut).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    if (m !== moisCourant) { html += `<div class="mois-titre">${esc(m)}</div>`; moisCourant = m; }
    html += carteConcours(c);
  }
  return html;
}
function vueMois() {
  const m = etat.moisAffiche;
  const tous = etat.concours.filter(concoursFiltresSansDate);
  const premier = new Date(m.getFullYear(), m.getMonth(), 1);
  const debut = new Date(premier); debut.setDate(1 - (premier.getDay() + 6) % 7);
  const dernier = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const t = aujourdhui();
  let html = `<div class="cal-nav"><button class="secondaire petit" onclick="app.mois(-1)">&lsaquo; Préc.</button>
    <div class="t">${esc(m.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }))}</div>
    <button class="secondaire petit" onclick="app.mois(1)">Suiv. &rsaquo;</button>
    <button class="secondaire petit" onclick="app.mois(0)">Aujourd'hui</button></div>
    <div class="mg"><div class="mg-entete">${['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'].map(j => `<div><span class="long">${j}</span><span class="court">${j.slice(0, 3)}</span></div>`).join('')}</div>`;
  const semaine = new Date(debut);
  while (semaine <= dernier) {
    const jours = [...Array(7)].map((_, i) => { const d = new Date(semaine); d.setDate(semaine.getDate() + i); return d; });
    const d0 = isoLocal(jours[0]), d6 = isoLocal(jours[6]);
    // concours qui touchent cette semaine, places en "couloirs" pour ne pas se chevaucher
    const ev = tous.filter(c => c.date_debut <= d6 && (c.date_fin || c.date_debut) >= d0)
      .map(c => {
        const deb = c.date_debut < d0 ? d0 : c.date_debut, fin = (c.date_fin || c.date_debut) > d6 ? d6 : (c.date_fin || c.date_debut);
        const col = j => jours.findIndex(x => isoLocal(x) === j);
        return { c, s: col(deb), e: col(fin), suiteG: c.date_debut < d0, suiteD: (c.date_fin || c.date_debut) > d6 };
      })
      .sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
    const couloirs = [];
    for (const x of ev) {
      let k = couloirs.findIndex(fin => fin < x.s);
      if (k < 0) { k = couloirs.length; couloirs.push(-1); }
      couloirs[k] = x.e; x.k = k;
    }
    html += `<div class="mg-semaine" style="--n:${Math.max(couloirs.length, 1)}">`;
    jours.forEach((d, i) => {
      const iso = isoLocal(d);
      html += `<div class="mg-jour ${d.getMonth() !== m.getMonth() ? 'hors' : ''} ${i >= 5 ? 'we' : ''} ${iso === t ? 'auj' : ''}" style="grid-column:${i + 1}"><span class="n">${d.getDate()}</span></div>`;
    });
    for (const x of ev) {
      const c = x.c, fams = famillesConcours(c);
      const nivs = (c.niveaux || []).map(id => niveau(id)?.nom).filter(Boolean).join(', ');
      const qualif = (c.championnats || []).length ? '<span class="q">Q</span>' : '';
      const autres = fams.length > 1 ? `<span class="autres">${fams.slice(1).map(f => `<i style="background:${couleurFamille(f)}"></i>`).join('')}</span>` : '';
      const classes = ['barre', c.statut === 'provisoire' ? 'provisoire' : '', c.statut === 'annule' ? 'annule' : '', x.suiteG ? 'suite-g' : '', x.suiteD ? 'suite-d' : ''].join(' ');
      html += `<div class="${classes}" style="grid-column:${x.s + 1} / ${x.e + 2}; grid-row:${x.k + 2}; background-color:${couleurFamille(fams[0])}"
        title="${esc(titreConcours(c) + ' - ' + fmtPeriode(c) + (nivs ? ' - ' + nivs : ''))}" onclick="app.detail(${c.id})">${qualif}${esc(c.commune)}${nivs ? ' · ' + esc(nivs) : ''}${autres}</div>`;
    }
    html += '</div>';
    semaine.setDate(semaine.getDate() + 7);
  }
  html += '</div>';
  const familles = etat.familles.filter(f => f.actif);
  html += `<div class="legende">
    <div class="groupe"><span class="titre-leg">Familles :</span>${familles.map(f => `<span><span class="leg-ech" style="background-color:${couleurFamille(f)}"></span>${esc(f.nom)}</span>`).join('')}</div>
  </div><div class="legende">
    <div class="groupe"><span class="titre-leg">Statut :</span>
      <span><span class="leg-ech"></span>Confirmé</span>
      <span><span class="leg-ech provisoire"></span>Date provisoire</span>
      <span><span class="leg-ech annule"></span>Annulé</span>
      <span><span class="barre" style="display:inline-block;background:#7b827d;padding:0 5px;height:20px;line-height:20px"><span class="q" style="display:inline-block">Q</span></span> Qualificatif</span>
      <span><span class="barre" style="display:inline-block;background:#7b827d;padding:0 5px;height:20px;line-height:20px"><span class="autres" style="display:inline-flex;margin:0"><i style="background:#2f6690"></i></span></span> Autre famille au même concours</span>
    </div></div>
    <p class="sous">Clique sur un concours pour voir le détail.</p>`;
  return html;
}
function concoursFiltresSansDate(c) {
  const sauv = etat.filtres.passes; etat.filtres.passes = true;

  const liste = etat.concours.filter(c => (estAdmin() && etat.tousConcours) || c.organisateur_id === uid)
    .slice().sort((a, b) => b.date_debut.localeCompare(a.date_debut));
  return `<h2>${etat.tousConcours ? 'Tous les concours' : 'Mes concours'}</h2>${blocMessage()}
    <div class="actions" style="margin:0 0 12px">
      <button onclick="location.hash='#concours/nouveau'">+ Nouveau concours</button>
      ${estAdmin() ? `<button class="secondaire" onclick="app.basculerTous()">${etat.tousConcours ? 'Voir seulement les miens' : 'Voir tous les concours (admin)'}</button>` : ''}
    </div>
    ${liste.length ? liste.map(c => carteConcours(c, true)).join('') : '<p class="vide">Aucun concours pour le moment.</p>'}`;
}
function vueFormConcours(id) {
  if (!estValide()) { location.hash = '#fiche'; return ''; }
  const p = etat.profil;
  let c;
  if (id === 'nouveau') {
    const modele = etat.modele; etat.modele = null;
    c = modele || {
      commune: p.commune_habituelle || '', departement: p.departement || '', region: p.region || '',
      adresse: p.adresse_habituelle || '', niveaux: p.epreuves_proposees || [], juges: [], championnats: [],
      contact: [p.responsable, p.telephone, p.email].filter(Boolean).join(' - '), statut: 'provisoire',
    };
  } else {
    c = etat.concours.find(x => String(x.id) === id);
    if (!c) return '<p class="vide">Concours introuvable.</p>';
  }
  const ch = (cid, label, val, type = 'text', large = false, extra = '') =>
    `<div class="champ ${large ? 'large' : ''}"><label>${label}</label><input id="${cid}" type="${type}" value="${esc(val)}" ${extra}></div>`;
  const jugesDispo = etat.juges.filter(j => j.actif || (c.juges || []).includes(j.id));
  const champDispo = etat.championnats.filter(x => x.actif || (c.championnats || []).includes(x.id));
  return `<h2>${id === 'nouveau' ? 'Nouveau concours' : 'Modifier le concours'}</h2>${blocMessage()}
  <div class="carte">
    <h3 style="margin-top:0">Quand et où</h3>
    <div class="grille">
      ${ch('k-titre', 'Titre (facultatif, sinon généré automatiquement)', c.titre, 'text', true)}
      ${ch('k-debut', 'Date de début *', c.date_debut, 'date')}
      ${ch('k-fin', 'Date de fin (si plusieurs jours)', c.date_fin, 'date')}
      ${ch('k-commune', 'Commune *', c.commune)}
      ${ch('k-dep', 'Département', c.departement)}
      <div class="champ"><label>Région</label>${selectRegion('k-region', c.region)}</div>
      ${ch('k-adresse', 'Adresse / lieu-dit', c.adresse)}
    </div>
    <h3>Épreuves</h3>
    ${casesNiveaux('k-niv', c.niveaux || [])}
    <h3>Juge(s)</h3>
    ${jugesDispo.length ? `<div class="cases">${jugesDispo.map(j =>
      `<label><input type="checkbox" name="k-juge" value="${j.id}" ${(c.juges || []).includes(j.id) ? 'checked' : ''}> ${esc(j.nom)}${j.secteur ? ' <span class="sous">(' + esc(j.secteur) + ')</span>' : ''}</label>`).join('')}</div>`
      : '<p class="sous">La liste officielle des juges n\'est pas encore remplie.</p>'}
    <div class="champ" style="margin-top:8px"><label>Autre juge (s'il n'est pas dans la liste)</label><input id="k-juge-autre" value="${esc(c.juge_autre)}"></div>
    <h3>Qualificatif pour</h3>
    <div class="cases">${champDispo.map(x =>
      `<label><input type="checkbox" name="k-champ" value="${x.id}" ${(c.championnats || []).includes(x.id) ? 'checked' : ''}> ${esc(x.nom)}</label>`).join('')}</div>
    <h3>Inscriptions</h3>
    <div class="grille">
      ${ch('k-ouv', 'Ouverture des inscriptions', c.inscription_ouverture, 'date')}
      ${ch('k-clo', 'Clôture des inscriptions', c.inscription_cloture, 'date')}
      ${ch('k-places', 'Nombre de places', c.places, 'number', false, 'min="0"')}
      ${ch('k-lien', "Lien d'inscription ou d'infos", c.inscription_lien, 'url')}
      ${ch('k-contact', 'Contact', c.contact, 'text', true)}
    </div>
    <h3>Statut et remarques</h3>
    <div class="grille">
      <div class="champ"><label>Statut</label><select id="k-statut">${Object.entries(STATUTS).map(([k, v]) =>
        `<option value="${k}" ${c.statut === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="champ large"><label>Remarques</label><textarea id="k-rem">${esc(c.remarques)}</textarea></div>
    </div>
    <div class="actions">
      <button onclick="app.enregistrerConcours('${esc(id)}')">Enregistrer</button>
      <button class="secondaire" onclick="location.hash='#mes-concours'">Annuler</button>
    </div>
  </div>`;
}

// ---------- vue : administration ----------
const CONFIG_LISTES = {
  familles: { titre: 'Familles d\'épreuves', champs: [['nom', 'Nom', 'text'], ['couleur', 'Couleur', 'color'], ['ordre', 'Ordre', 'number'], ['actif', 'Active', 'checkbox']] },
  niveaux: { titre: 'Épreuves / niveaux', champs: [['famille_id', 'Famille', 'famille'], ['nom', 'Nom', 'text'], ['ordre', 'Ordre', 'number'], ['actif', 'Active', 'checkbox']] },
  championnats: { titre: 'Championnats', champs: [['nom', 'Nom', 'text'], ['ordre', 'Ordre', 'number'], ['actif', 'Actif', 'checkbox']] },
  juges: { titre: 'Juges officiels', champs: [['nom', 'Nom', 'text'], ['secteur', 'Secteur', 'text'], ['actif', 'Actif', 'checkbox']] },
};
function champListe(table, idLigne, [nom, , type], val) {
  const idc = `l-${table}-${idLigne}-${nom}`;
  if (type === 'checkbox') return `<input type="checkbox" id="${idc}" style="width:auto" ${val ? 'checked' : ''}>`;
  if (type === 'famille') return `<select id="${idc}">${etat.familles.map(f => `<option value="${f.id}" ${f.id === val ? 'selected' : ''}>${esc(f.nom)}</option>`).join('')}</select>`;
  if (type === 'color') {
    const f = table === 'familles' && idLigne !== 'nouveau' ? famille(idLigne) : null;
    return `<input id="${idc}" type="color" style="width:56px;height:32px;padding:2px" value="${esc(val || (f ? couleurFamille(f) : '#6b7280'))}">`;
  }
  return `<input id="${idc}" type="${type}" value="${esc(val)}">`;
}
function editeurListe(table) {
  const cfg = CONFIG_LISTES[table];
  let lignes = etat[table].slice();
  if (table === 'niveaux') lignes.sort((a, b) => (famille(a.famille_id)?.ordre ?? 0) - (famille(b.famille_id)?.ordre ?? 0) || a.ordre - b.ordre);
  const entete = cfg.champs.map(c => `<th>${c[1]}</th>`).join('') + '<th></th>';
  const corps = lignes.map(l => `<tr>${cfg.champs.map(c => `<td>${champListe(table, l.id, c, l[c[0]])}</td>`).join('')}
    <td style="white-space:nowrap"><button class="petit" onclick="app.majLigne('${table}', ${l.id})">OK</button>
    <button class="petit danger" onclick="app.supprLigne('${table}', ${l.id})">X</button></td></tr>`).join('');
  const defauts = { ordre: 0, actif: true, famille_id: etat.familles[0]?.id };
  const ajout = `<tr>${cfg.champs.map(c => `<td>${champListe(table, 'nouveau', c, defauts[c[0]] ?? '')}</td>`).join('')}
    <td><button class="petit" onclick="app.ajoutLigne('${table}')">Ajouter</button></td></tr>`;
  return `<h3>${cfg.titre}</h3><div class="tableau"><table><tr>${entete}</tr>${corps}${ajout}</table></div>
    <p class="sous">Conseil : plutôt que supprimer un élément déjà utilisé, décoche "Actif" pour le masquer des formulaires.</p>`;
}
function vueAdmin() {
  if (!estAdmin()) { location.hash = '#calendrier'; return ''; }
  const o = etat.ongletAdmin;
  const onglet = (k, t) => `<button class="${o === k ? 'actif' : ''}" onclick="app.ongletAdmin('${k}')">${t}</button>`;
  let corps = '';
  if (o === 'comptes') {
    const comptes = etat.comptes || [];
    const attente = comptes.filter(c => c.statut === 'en_attente').length;
    corps = `<p class="sous">${attente} compte(s) en attente de validation.</p><div class="tableau"><table>
      <tr><th>Club</th><th>Responsable</th><th>Email</th><th>Inscrit le</th><th>Statut</th><th>Role</th></tr>
      ${comptes.map(c => `<tr>
        <td>${esc(c.nom_club || '(sans nom)')}</td><td>${esc(c.responsable)}</td><td>${esc(c.email)}</td>
        <td>${esc(new Date(c.created_at).toLocaleDateString('fr-FR'))}</td>
        <td><select onchange="app.majCompte('${c.id}', 'statut', this.value)">${[['en_attente', 'En attente'], ['valide', 'Validé'], ['refuse', 'Refusé']]
          .map(([k, v]) => `<option value="${k}" ${c.statut === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td><select onchange="app.majCompte('${c.id}', 'role', this.value)">${[['organisateur', 'Organisateur'], ['admin', 'Admin']]
          .map(([k, v]) => `<option value="${k}" ${c.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
      </tr>`).join('')}</table></div>`;
  } else {
    corps = editeurListe(o === 'epreuves' ? 'familles' : o) + (o === 'epreuves' ? editeurListe('niveaux') : '');
  }
  return `<h2>Administration</h2>${blocMessage()}
    <div class="onglets">${onglet('comptes', 'Comptes')}${onglet('epreuves', 'Épreuves')}${onglet('championnats', 'Championnats')}${onglet('juges', 'Juges')}</div>
    ${corps}`;
}

// ---------- rendu ----------
async function rendre() {
  menu();
  const h = location.hash || '#calendrier';
  let html;
  if (h === '#connexion' || h === '#inscription' || h === '#oubli') html = vueConnexion(h.slice(1));
  else if (h === '#nouveau-mdp') html = vueNouveauMdp();
  else if (h === '#fiche') html = vueFiche();
  else if (h === '#mes-concours') html = vueMesConcours();
  else if (h.startsWith('#concours/')) html = vueFormConcours(h.slice(10));
  else if (h === '#admin') {
    if (estAdmin() && etat.ongletAdmin === 'comptes' && !etat.comptes) await chargerComptes();
    html = vueAdmin();
  }
  else if (h === '#mois') html = vueCalendrier(true);
  else if (h === '#mentions') html = vueMentions();
  else html = vueCalendrier();
  document.getElementById('vue').classList.toggle('large', h === '#mois');
  const accueil = h === '#calendrier';
  const bandeau = accueil ? bandeauAccueil() : '';
  if (bandeau !== etat.dernierBandeau) { document.getElementById('bandeau').innerHTML = bandeau; etat.dernierBandeau = bandeau; }
  if (html !== '') document.getElementById('vue').innerHTML = html;
}
async function chargerComptes() {
  const { data, error } = await sb.from('organisateurs').select('*').order('created_at', { ascending: false });
  if (error) message('err', traduireErreur(error)); else etat.comptes = data;
}
async function action(fn) {
  etat.message = null;
  try { await fn(); } catch (e) { message('err', traduireErreur(e)); }
  await rendre();
  window.scrollTo(0, 0);
}

// ---------- actions ----------
window.app = {
  filtre(k, v) { etat.filtres[k] = v; if (k === 'famille') etat.filtres.niveau = ''; rendre(); },
  mois(delta) {
    const m = etat.moisAffiche;
    etat.moisAffiche = delta === 0 ? debutMois(new Date()) : new Date(m.getFullYear(), m.getMonth() + delta, 1);
    rendre();
  },
  detail(id) {
    const c = etat.concours.find(x => x.id === id); if (!c) return;
    document.getElementById('fenetre-contenu').innerHTML = detailHtml(c);
    document.getElementById('fenetre').classList.add('visible');
  },
  fermer() { document.getElementById('fenetre').classList.remove('visible'); },

  connexion: () => action(async () => {
    const { error } = await sb.auth.signInWithPassword({ email: valeur('c-email'), password: document.getElementById('c-mdp').value });
    if (error) throw error;
    location.hash = '#fiche';
  }),
  inscription: () => action(async () => {
    const club = valeur('i-club'), email = valeur('i-email'), mdp = document.getElementById('i-mdp').value;
    if (!club) throw new Error('Indique le nom du club.');
    if (mdp.length < 8) throw new Error('Le mot de passe doit faire au moins 8 caractères.');
    const { error } = await sb.auth.signUp({ email, password: mdp,
      options: { data: { nom_club: club }, emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
    message('ok', 'Compte créé ! Clique sur le lien de confirmation recu par mail, puis connecte-toi.');
    location.hash = '#connexion';
  }),
  oubli: () => action(async () => {
    const { error } = await sb.auth.resetPasswordForEmail(valeur('o-email'), { redirectTo: location.origin + location.pathname });
    if (error) throw error;
    message('ok', 'Si un compte existe avec cet email, un lien vient de t\'être envoyé.');
  }),
  nouveauMdp: () => action(async () => {
    const mdp = document.getElementById('n-mdp').value;
    if (mdp.length < 8) throw new Error('Le mot de passe doit faire au moins 8 caractères.');
    const { error } = await sb.auth.updateUser({ password: mdp });
    if (error) throw error;
    message('ok', 'Mot de passe modifié.');
    location.hash = '#fiche';
  }),
  deconnexion: async () => { await sb.auth.signOut(); location.hash = '#calendrier'; },

  enregistrerFiche: () => action(async () => {
    if (!valeur('f-club')) throw new Error('Le nom du club est obligatoire.');
    const maj = {
      nom_club: valeur('f-club'), responsable: ouNull(valeur('f-resp')), email: ouNull(valeur('f-email')),
      telephone: ouNull(valeur('f-tel')), region: ouNull(valeur('f-region')), departement: ouNull(valeur('f-dep')),
      commune_habituelle: ouNull(valeur('f-commune')), adresse_habituelle: ouNull(valeur('f-adresse')),
      site_web: ouNull(valeur('f-site')), epreuves_proposees: cochees('f-niv'),
    };
    const { error } = await sb.from('organisateurs').update(maj).eq('id', etat.session.user.id);
    if (error) throw error;
    await chargerProfil();
    message('ok', 'Fiche enregistrée.');
  }),

  enregistrerConcours: (id) => action(async () => {
    const d = {
      titre: ouNull(valeur('k-titre')), date_debut: valeur('k-debut'), date_fin: ouNull(valeur('k-fin')),
      commune: valeur('k-commune'), departement: ouNull(valeur('k-dep')), region: ouNull(valeur('k-region')),
      adresse: ouNull(valeur('k-adresse')), niveaux: cochees('k-niv'), juges: cochees('k-juge'),
      juge_autre: ouNull(valeur('k-juge-autre')), championnats: cochees('k-champ'),
      inscription_ouverture: ouNull(valeur('k-ouv')), inscription_cloture: ouNull(valeur('k-clo')),
      places: valeur('k-places') === '' ? null : Number(valeur('k-places')),
      inscription_lien: ouNull(valeur('k-lien')), contact: ouNull(valeur('k-contact')),
      statut: valeur('k-statut'), remarques: ouNull(valeur('k-rem')),
    };
    if (!d.date_debut || !d.commune) throw new Error('La date de début et la commune sont obligatoires.');
    if (d.date_fin && d.date_fin < d.date_debut) throw new Error('La date de fin est avant la date de début.');
    if (d.inscription_ouverture && d.inscription_cloture && d.inscription_cloture < d.inscription_ouverture)
      throw new Error("La clôture des inscriptions est avant l'ouverture.");
    if (!d.niveaux.length) throw new Error('Coche au moins une épreuve.');
    const req = id === 'nouveau' ? sb.from('concours').insert(d) : sb.from('concours').update(d).eq('id', Number(id));
    const { error } = await req;
    if (error) throw error;
    await chargerConcours();
    message('ok', 'Concours enregistré.');
    location.hash = '#mes-concours';
  }),
  dupliquer(id) {
    const c = etat.concours.find(x => x.id === id); if (!c) return;
    const { id: _i, organisateur_id, organisateur, created_at, updated_at, ...copie } = c;
    etat.modele = { ...copie, date_debut: '', date_fin: '', inscription_ouverture: '', inscription_cloture: '', statut: 'provisoire' };
    location.hash = '#concours/nouveau';
  },
  supprimerConcours: (id) => {
    if (!confirm('Supprimer définitivement ce concours ?')) return;
    action(async () => {
      const { error } = await sb.from('concours').delete().eq('id', id);
      if (error) throw error;
      await chargerConcours();
      message('ok', 'Concours supprimé.');
    });
  },
  basculerTous() { etat.tousConcours = !etat.tousConcours; rendre(); },

  ongletAdmin: (o) => action(async () => {
    etat.ongletAdmin = o;
    if (o === 'comptes') await chargerComptes();
  }),
  majCompte: (id, champ, val) => action(async () => {
    const { error } = await sb.from('organisateurs').update({ [champ]: val }).eq('id', id);
    if (error) throw error;
    await chargerComptes();
    if (id === etat.session.user.id) await chargerProfil();
    message('ok', 'Compte mis à jour.');
  }),
  majLigne: (table, id) => action(async () => {
    const { error } = await sb.from(table).update(lireLigne(table, id)).eq('id', id);
    if (error) throw error;
    await chargerReferences();
    message('ok', 'Enregistré.');
  }),
  ajoutLigne: (table) => action(async () => {
    const d = lireLigne(table, 'nouveau');
    if (!d.nom) throw new Error('Le nom est obligatoire.');
    const { error } = await sb.from(table).insert(d);
    if (error) throw error;
    await chargerReferences();
    message('ok', 'Ajouté.');
  }),
  supprLigne: (table, id) => {
    if (!confirm('Supprimer cet élément ? (Les concours qui l\'utilisent ne l\'afficheront plus.)')) return;
    action(async () => {
      const { error } = await sb.from(table).delete().eq('id', id);
      if (error) throw error;
      await chargerReferences();
      message('ok', 'Supprimé.');
    });
  },
};
function lireLigne(table, id) {
  const d = {};
  for (const [nom, , type] of CONFIG_LISTES[table].champs) {
    const el = document.getElementById(`l-${table}-${id}-${nom}`);
    if (type === 'checkbox') d[nom] = el.checked;
    else if (type === 'number' || type === 'famille') d[nom] = Number(el.value) || 0;
    else d[nom] = el.value.trim() || null;
  }
  return d;
}

// ---------- demarrage ----------
window.addEventListener('hashchange', () => {
  app.fermer();
  if (etat.message?.page && etat.message.page !== location.hash) etat.message = null;
  rendre();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') app.fermer(); });

sb.auth.onAuthStateChange((evenement, session) => {
  // setTimeout : ne pas appeler Supabase directement dans ce rappel
  setTimeout(async () => {
    etat.session = session;
    etat.comptes = null;
    if (evenement === 'PASSWORD_RECOVERY') location.hash = '#nouveau-mdp';
    try { await chargerProfil(); await chargerConcours(); } catch (e) { message('err', traduireErreur(e)); }
    rendre();
  }, 0);
});

(async () => {
  if (SUPABASE_URL.includes('VOTRE-PROJET')) {
    document.getElementById('vue').innerHTML = '<div class="msg err">Configuration manquante : renseigne SUPABASE_URL et SUPABASE_KEY en haut du script (voir le guide de mise en ligne).</div>';
    return;
  }
  try {
    const { data } = await sb.auth.getSession();
    etat.session = data.session;
    await Promise.all([chargerReferences(), chargerConcours(), chargerProfil()]);
  } catch (e) { message('err', 'Impossible de charger les données : ' + traduireErreur(e)); }
  rendre();
})();
</script>
</body>
</html>
